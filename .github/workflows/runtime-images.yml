name: Runtime image updates

on:
  schedule:
    # 09:17 JST; avoid the busy start of the UTC hour.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-image-updates
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      updates: ${{ steps.images.outputs.updates }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.7
      - name: Check image versions
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mise run images:check > "$RUNNER_TEMP/runtime-images.json"
          check_rc=$?
          set -e
          case "$check_rc" in
            0) echo "updates=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "updates=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Image discovery failed (exit $check_rc)" >&2; exit "$check_rc" ;;
          esac
      - name: Save detection evidence
        uses: actions/upload-artifact@v7
        with:
          name: runtime-image-report
          path: ${{ runner.temp }}/runtime-images.json
          retention-days: 14

  publish:
    needs: check
    if: needs.check.outputs.updates == 'true' && github.repository == 'apstndb/spanemuboost' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.7
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: runtime-image-report
          path: ${{ runner.temp }}
      - name: Verify the broker hostname
        env:
          STS_HOST: ${{ vars.OCTO_STS_HOST }}
        run: |
          grep -Fxq -- "audience: $STS_HOST" .github/chainguard/runtime-images.sts.yaml
      - name: Get the runtime image update token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: ${{ vars.OCTO_STS_HOST }}
          scope: ${{ github.repository }}
          identity: runtime-images
      - name: Create or update the image PR
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GITHUB_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          # Route Git and GitHub API writes through the same installation token.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          # Fail before writing if the broker ever returns a broader token.
          gh api --paginate installation/repositories |
            jq -se --arg repo "$GITHUB_REPOSITORY" --argjson id "$GITHUB_REPOSITORY_ID" \
              '[.[].repositories[] | {id,full_name}] == [{id:$id,full_name:$repo}]' > /dev/null
          echo 'Installation token is scoped to this repository only.'
          mise exec --no-deps -- bash scripts/update-runtime-image-pr.sh "$RUNNER_TEMP/runtime-images.json"
